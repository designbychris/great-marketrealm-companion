<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 480 600"
    role="img"
    aria-labelledby="title">
<title id="title">Approved clean Apple Fructan body shadow</title>

<defs>
  <linearGradient
      id="body-shadow"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
  >
    <stop
        offset="0"
        stop-color="#541A2D"
        stop-opacity="0"
    />
    <stop
        offset=".55"
        stop-color="#541A2D"
        stop-opacity=".18"
    />
    <stop
        offset="1"
        stop-color="#35101D"
        stop-opacity=".7"
    />
  </linearGradient>
</defs>

<!-- Right-side paint shadow follows only the fruit, not the neckline. -->
<path
    d="
        M240 126
        C262 99 293 95 320 111
        C358 133 376 176 370 229
        C364 286 338 329 295 355
        C278 365 260 371 240 374
        Z
    "
    fill="url(#body-shadow)"
/>
</svg>
