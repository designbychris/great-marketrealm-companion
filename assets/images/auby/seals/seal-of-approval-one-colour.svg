<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 320 320"
    role="img"
    aria-labelledby="title">
<title id="title">Auby Seal of Approval</title>

<defs>
  <filter id="rough-ink" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence
        type="fractalNoise"
        baseFrequency="0.035"
        numOctaves="2"
        seed="17"
        result="grain"
    />
    <feDisplacementMap
        in="SourceGraphic"
        in2="grain"
        scale="1.8"
        xChannelSelector="R"
        yChannelSelector="G"
    />
  </filter>
</defs>

<g
    fill="none"
    stroke="#5e337a"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#rough-ink)"
>
  <circle cx="160" cy="160" r="146" stroke-width="8"/>
  <path
      d="M60 118A110 110 0 0 1 260 118"
      stroke-width="5"
  />
  <path
      d="M60 205A110 110 0 0 0 260 205"
      stroke-width="5"
  />
</g>

<g fill="#5e337a">
  <text
      x="160"
      y="72"
      text-anchor="middle"
      font-size="34"
      font-weight="800"
      letter-spacing="4"
      font-family="Arial, sans-serif"
  >SEAL OF</text>

  <text
      x="160"
      y="276"
      text-anchor="middle"
      font-size="31"
      font-weight="800"
      letter-spacing="2.5"
      font-family="Arial, sans-serif"
  >APPROVAL</text>
</g>

<!-- One-colour Auby -->
<g transform="translate(82 88)">
  <path
      d="M78 33
         C57 17 34 25 26 48
         C13 84 27 128 78 144
         C129 128 143 84 130 48
         C122 25 99 17 78 33Z"
      fill="#f8edd3"
      stroke="#5e337a"
      stroke-width="6"
  />

  <g
      fill="#5e337a"
      stroke="#5e337a"
      stroke-width="4"
  >
    <path d="M77 31C54 28 37 17 29 1c23-3 41 8 48 30Z"/>
    <path d="M81 31c22-9 43-5 57 10-16 16-37 14-57-10Z"/>
    <path d="M70 34c-21 14-41 16-56 5 13-19 32-21 56-5Z"/>
    <path d="M79 26c-6-22-1-37 13-48 11 16 7 33-13 48Z"/>
  </g>

  <ellipse cx="57" cy="75" rx="10" ry="14" fill="#5e337a"/>
  <ellipse cx="99" cy="75" rx="10" ry="14" fill="#5e337a"/>
  <circle cx="54" cy="70" r="3.5" fill="#f8edd3"/>
  <circle cx="96" cy="70" r="3.5" fill="#f8edd3"/>

  <path
      d="M60 95q18 20 36 0q-3 25-18 25T60 95Z"
      fill="#5e337a"
  />

  <!-- waving arm -->
  <path
      d="M30 96
         q-22-7-27-27
         q7-6 13 2
         q-1-12 7-12
         q7 1 5 13
         q7-8 13-2
         q2 16-11 26Z"
      fill="#f8edd3"
      stroke="#5e337a"
      stroke-width="6"
  />

  <!-- cloak -->
  <path
      d="M39 117
         q39 29 78 0
         l19 38
         H20Z"
      fill="#f8edd3"
      stroke="#5e337a"
      stroke-width="6"
  />
  <path
      d="M50 124l28 21 28-21"
      fill="none"
      stroke="#5e337a"
      stroke-width="6"
  />
  <path
      d="M78 145l10 9-10 9-10-9Z"
      fill="#5e337a"
  />
</g>

<g fill="#5e337a" opacity=".78">
  <circle cx="42" cy="156" r="3"/>
  <circle cx="278" cy="164" r="4"/>
  <circle cx="56" cy="191" r="2.5"/>
  <circle cx="267" cy="199" r="2.5"/>
  <path d="M43 138l4 7 8 2-6 6 1 8-7-4-7 4 1-8-6-6 8-2Z"/>
  <path d="M277 133l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>
</g>
</svg>
