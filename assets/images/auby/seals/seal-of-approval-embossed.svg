<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 320 320"
    role="img"
    aria-labelledby="title">
<title id="title">Auby embossed Seal of Approval</title>

<defs>
  <path
      id="seal-top-arc"
      d="M55 159
         A105 105 0 0 1 265 159"
  />
  <path
      id="seal-bottom-arc"
      d="M48 190
         A118 118 0 0 0 272 190"
  />

  <filter
      id="rough-ink"
      x="-12%"
      y="-12%"
      width="124%"
      height="124%"
      color-interpolation-filters="sRGB"
  >
    <feTurbulence
        type="fractalNoise"
        baseFrequency="0.032"
        numOctaves="2"
        seed="23"
        result="grain"
    />
    <feDisplacementMap
        in="SourceGraphic"
        in2="grain"
        scale="1.55"
        xChannelSelector="R"
        yChannelSelector="G"
    />
  </filter>
</defs>

<g
    fill="none"
    stroke="#B58E55"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#rough-ink)"
>
  <circle
      cx="160"
      cy="160"
      r="145"
      stroke-width="8"
  />

  <circle
      cx="160"
      cy="160"
      r="116"
      stroke-width="4.5"
      stroke-dasharray="410 14 92 9 150 11"
  />
</g>

<g
    fill="#B58E55"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
>
  <text
      font-size="32"
      letter-spacing="4.2"
  >
    <textPath
        href="#seal-top-arc"
        startOffset="50%"
        text-anchor="middle"
    >SEAL OF</textPath>
  </text>

  <text
      font-size="29"
      letter-spacing="2.2"
  >
    <textPath
        href="#seal-bottom-arc"
        startOffset="50%"
        text-anchor="middle"
    >APPROVAL</textPath>
  </text>
</g>

<!-- Auby: one-colour Guild Illuminator portrait -->
<g transform="translate(79 82)">
  <path
      d="M81 42
         C57 24 31 35 23 62
         C12 99 29 139 81 153
         C133 139 150 99 139 62
         C131 35 105 24 81 42Z"
      fill="#F3E2BF"
      stroke="#B58E55"
      stroke-width="6.5"
      stroke-linejoin="round"
  />

  <g
      fill="#B58E55"
      stroke="#B58E55"
      stroke-width="3.5"
      stroke-linejoin="round"
  >
    <path
        d="M80 40
           C55 37 36 26 28 8
           C54 5 73 16 80 40Z"
    />
    <path
        d="M84 39
           C108 29 130 34 145 50
           C127 68 105 64 84 39Z"
    />
    <path
        d="M72 42
           C50 58 28 60 11 48
           C25 28 47 27 72 42Z"
    />
    <path
        d="M82 34
           C76 10 81 -6 96 -18
           C108 0 102 19 82 34Z"
    />
  </g>

  <ellipse
      cx="58"
      cy="83"
      rx="10"
      ry="14"
      fill="#B58E55"
  />
  <ellipse
      cx="105"
      cy="83"
      rx="10"
      ry="14"
      fill="#B58E55"
  />

  <circle
      cx="55"
      cy="78"
      r="3.5"
      fill="#F3E2BF"
  />
  <circle
      cx="102"
      cy="78"
      r="3.5"
      fill="#F3E2BF"
  />

  <path
      d="M62 104
         q19 21 38 0
         q-4 26-19 26
         q-15 0-19-26Z"
      fill="#B58E55"
  />

  <!-- waving hand -->
  <path
      d="M31 102
         q-24-8-29-30
         q7-7 14 2
         q-1-13 7-13
         q8 1 6 14
         q8-9 14-2
         q2 17-12 29Z"
      fill="#F3E2BF"
      stroke="#B58E55"
      stroke-width="6"
      stroke-linejoin="round"
  />

  <!-- little Guild cloak -->
  <path
      d="M40 127
         q41 29 82 0
         l17 38
         H23Z"
      fill="#F3E2BF"
      stroke="#B58E55"
      stroke-width="6"
      stroke-linejoin="round"
  />

  <path
      d="M50 132
         l31 23
         l31-23"
      fill="none"
      stroke="#B58E55"
      stroke-width="6"
      stroke-linecap="round"
  />

  <path
      d="M81 153
         l10 9
         l-10 10
         l-10-10Z"
      fill="#B58E55"
  />
</g>

<g fill="#B58E55" opacity=".72">
  <circle cx="43" cy="158" r="3"/>
  <circle cx="279" cy="162" r="4"/>
  <circle cx="55" cy="196" r="2.5"/>
  <circle cx="267" cy="203" r="2.5"/>

  <path
      d="M40 137
         l4 8
         l9 2
         l-7 6
         l2 9
         l-8-5
         l-8 5
         l2-9
         l-7-6
         l9-2Z"
  />

  <path
