<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 640 420"
    role="img"
    aria-labelledby="title desc">
<title id="title">Auby at his Guild desk — Morning</title>
<desc id="desc">
    Auby, the aubergine Guild Keeper, works at a wooden desk beside
    parchment, ink, tea and an open Guild Journal.
</desc>

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F4E7C8"/>
    <stop offset="1" stop-color="#DDC497"/>
  </linearGradient>

  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#97603A"/>
    <stop offset=".52" stop-color="#6F4228"/>
    <stop offset="1" stop-color="#422718"/>
  </linearGradient>

  <radialGradient id="auby" cx="35%" cy="25%" r="82%">
    <stop stop-color="#A96CCE"/>
    <stop offset=".58" stop-color="#76439C"/>
    <stop offset="1" stop-color="#4A285E"/>
  </radialGradient>

  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#B8D94A"/>
    <stop offset="1" stop-color="#517923"/>
  </linearGradient>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2A160D" flood-opacity=".24"/>
  </filter>
</defs>

<rect width="640" height="420" rx="26" fill="url(#wall)"/>

<!-- Window -->
<g transform="translate(405 36)">
  <rect width="184" height="145" rx="18"
        fill="#5C3B2B" opacity=".2"/>
  <rect x="8" y="8" width="168" height="129" rx="13"
        fill="#F6C982" stroke="#68452E" stroke-width="8"/>
  <path d="M92 10v125M10 73h165"
        stroke="#68452E" stroke-width="6"/>
  <circle cx="42" cy="36" r="20" fill="#FFD677"/><path d="M118 24q18 10 30 29" fill="none" stroke="#FFF1B1" stroke-width="5"/>
</g>

<!-- Warm desk lamp -->
<g transform="translate(66 88)">
  <path d="M50 58V0" stroke="#6D472B" stroke-width="9" stroke-linecap="round"/>
  <path d="M15 60h70L68 18H32Z"
        fill="#F4D58D" stroke="#6D472B" stroke-width="6"/>
  <ellipse cx="50" cy="64" rx="51" ry="18"
           fill="#F4D58D" opacity=".18"/>
</g>

<!-- Desk -->
<g filter="url(#shadow)">
  <path d="M26 257Q320 229 614 257L593 405H47Z"
        fill="url(#desk)" stroke="#4B2A1A" stroke-width="10"/>
  <path d="M45 292Q320 271 595 292"
        fill="none" stroke="#B47B4B" stroke-width="5" opacity=".38"/>
  <path d="M58 338Q320 321 580 340"
        fill="none" stroke="#3F2518" stroke-width="4" opacity=".28"/>
</g>

<!-- Guild Journal -->
<g transform="translate(278 283) rotate(-3)">
  <path d="M0 0q66-19 128 2v86q-63-19-128 1Z"
        fill="#EFE0B4" stroke="#5F3F29" stroke-width="7"/>
  <path d="M128 2q53-13 94 5v85q-44-15-94-4Z"
        fill="#E7D29C" stroke="#5F3F29" stroke-width="7"/>
  <path d="M128 2v86" stroke="#5F3F29" stroke-width="5"/>
  <path d="M19 26h82M18 43h67M18 60h78"
        stroke="#9D7B49" stroke-width="4" stroke-linecap="round" opacity=".65"/>
</g>

<!-- Ink pot + quill -->
<g transform="translate(514 262)">
  <path d="M0 41h52l-7 56H8Z"
        fill="#4E315D" stroke="#34203E" stroke-width="6"/>
  <path d="M29 47L72-35"
        stroke="#724B2C" stroke-width="6" stroke-linecap="round"/>
  <path d="M70-33q31 11 17 42q-18 18-40 29q10-42 23-71Z"
        fill="#E8D5A8" stroke="#81583A" stroke-width="5"/>
</g>

<!-- Tea -->
<g transform="translate(88 277)">
  <ellipse cx="43" cy="20" rx="43" ry="14" fill="#5B3926" opacity=".28"/>
  <path d="M7 17h70v51q-5 20-35 20T7 68Z"
        fill="#8BA462" stroke="#6B432B" stroke-width="6"/>
  <path d="M77 30q30-2 27 20q-4 18-28 13"
        fill="none" stroke="#6B432B" stroke-width="7"/>
  <path class="steam" d="M27 4q-12-20 3-35M49 2q-10-18 4-32"
        fill="none" stroke="#F8F0D7" stroke-width="5"
        stroke-linecap="round" opacity=".75"/>
</g>

<!-- Auby -->
<g transform="translate(174 80)" filter="url(#shadow)">
  <ellipse cx="82" cy="98" rx="62" ry="78"
           fill="url(#auby)" stroke="#3D214F" stroke-width="8"/>

  <g fill="url(#leaf)" stroke="#36521F" stroke-width="6">
    <path d="M82 30C53 26 31 12 21-8c30-5 54 10 61 38Z"/>
    <path d="M87 29c29-12 54-6 72 13-20 21-47 17-72-13Z"/>
    <path d="M72 33C47 49 22 51 2 38c16-24 40-27 70-5Z"/>
  </g>

  <path d="M82 25c-7-27-1-47 17-62c14 20 9 42-17 62Z"
        fill="#72972D" stroke="#36521F" stroke-width="6"/>

  <ellipse cx="58" cy="92" rx="12" ry="17" fill="#171019"/>
  <ellipse cx="106" cy="92" rx="12" ry="17" fill="#171019"/>
  <ellipse cx="55" cy="87" rx="4" ry="5" fill="#FFFFFF"/>
  <ellipse cx="103" cy="87" rx="4" ry="5" fill="#FFFFFF"/>

  <ellipse cx="42" cy="116" rx="14" ry="7" fill="#D9789C" opacity=".55"/>
  <ellipse cx="122" cy="116" rx="14" ry="7" fill="#D9789C" opacity=".55"/>

  <path d="M58 119q24 27 48 0q-5 31-24 31t-24-31Z"
        fill="#361626"/>
  <path d="M68 143q14 8 28 0"
        fill="none" stroke="#F2837C" stroke-width="6" stroke-linecap="round"/>

  <!-- Guild cloak -->
  <path d="M29 157q53 40 106 0l24 76H5Z"
        fill="#648A3C" stroke="#3A5A29" stroke-width="8"/>
  <path d="M48 165l34 28 34-28"
        fill="none" stroke="#D9B75D" stroke-width="6"/>
  <path d="M82 190l11 10-11 11-11-11Z"
        fill="#E3BB4E" stroke="#805C20" stroke-width="4"/>

  <!-- arm over journal -->
  <path d="M130 182q52 12 66 44"
        fill="none" stroke="#75439B" stroke-width="20"
        stroke-linecap="round"/>
</g>

<!-- Small workshop clutter -->
<g opacity=".78">
  <circle cx="166" cy="319" r="7" fill="#D4A12A"/>
  <circle cx="184" cy="327" r="5" fill="#D4A12A"/>
  <rect x="207" y="300" width="45" height="9" rx="4" fill="#78452B" transform="rotate(8 207 300)"/>
  <path d="M472 355q24-32 43 0" fill="none" stroke="#8C6B3F" stroke-width="6"/>
</g>
</svg>
