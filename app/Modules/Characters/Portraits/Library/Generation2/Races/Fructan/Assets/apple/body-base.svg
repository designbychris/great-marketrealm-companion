<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 480 600"
    role="img"
    aria-labelledby="title">
<title id="title">Rounded Apple Fructan body base</title>
<defs>

<filter
    id="painted-edge"
    x="-8%"
    y="-8%"
    width="116%"
    height="116%"
    color-interpolation-filters="sRGB"
>
  <feTurbulence
      type="fractalNoise"
      baseFrequency="0.018"
      numOctaves="2"
      seed="11"
      result="paper-grain"
  />
  <feDisplacementMap
      in="SourceGraphic"
      in2="paper-grain"
      scale="1.25"
      xChannelSelector="R"
      yChannelSelector="G"
  />
</filter>

  <radialGradient id="apple" cx="31%" cy="20%" r="86%">
    <stop offset="0" stop-color="#ff918a"/>
    <stop offset=".46" stop-color="#d84f60"/>
    <stop offset="1" stop-color="#882a40"/>
  </radialGradient>
</defs>

<path
    filter="url(#painted-edge)"
    d="M240 113
       C218 88 190 91 169 109
       C137 137 122 185 132 245
       C141 304 171 347 211 374
       C163 389 127 429 117 491
       L109 544
       H371
       L363 491
       C353 429 317 389 269 374
       C309 347 339 304 348 245
       C358 185 343 137 311 109
       C290 91 262 88 240 113Z"
    fill="url(#apple)"
    stroke="#642238"
    stroke-width="10"
    stroke-linejoin="round"/>

<path d="M142 425c-37 8-63 30-77 64"
      fill="none"
      stroke="#8a2b40"
      stroke-width="32"
      stroke-linecap="round"/>

<path d="M338 425c37 8 63 30 77 64"
      fill="none"
      stroke="#8a2b40"
      stroke-width="32"
      stroke-linecap="round"/>
</svg>
