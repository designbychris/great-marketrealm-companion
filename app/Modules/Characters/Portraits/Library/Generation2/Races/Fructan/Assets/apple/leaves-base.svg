<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 480 600"
    role="img"
    aria-labelledby="title">
  <title id="title">Painterly Apple Fructan leaves</title>
  <defs>

<filter
    id="painted-edge"
    x="-8%"
    y="-8%"
    width="116%"
    height="116%"
    color-interpolation-filters="sRGB"
>
  <feTurbulence
      type="fractalNoise"
      baseFrequency="0.018"
      numOctaves="2"
      seed="11"
      result="paper-grain"
  />
  <feDisplacementMap
      in="SourceGraphic"
      in2="paper-grain"
      scale="1.25"
      xChannelSelector="R"
      yChannelSelector="G"
  />
</filter>

    <linearGradient id="leaf-a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c7ea53"/>
      <stop offset=".5" stop-color="#79ab31"/>
      <stop offset="1" stop-color="#3d6720"/>
    </linearGradient>
    <linearGradient id="leaf-b" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#afd742"/>
      <stop offset=".55" stop-color="#69962a"/>
      <stop offset="1" stop-color="#35591c"/>
    </linearGradient>
  </defs>

  <g filter="url(#painted-edge)" stroke="#34531d" stroke-linejoin="round">
    <path d="M240 116c-48-1-85-23-105-58 45-12 86 7 105 58Z"
          fill="url(#leaf-a)" stroke-width="9"/>
    <path d="M247 114c44-19 85-14 114 13-30 35-72 34-114-13Z"
          fill="url(#leaf-b)" stroke-width="8"/>
    <path d="M212 125c-43 31-85 37-117 15 24-41 65-48 117-15Z"
          fill="url(#leaf-b)" stroke-width="9"/>
    <path d="M269 119c39-40 81-55 119-41-11 45-49 63-119 41Z"
          fill="url(#leaf-a)" stroke-width="8"/>
    <path d="M225 115c-17-37-12-68 14-91 23 25 18 58-14 91Z"
          fill="#86b334" stroke-width="8"/>
  </g>
</svg>
